<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <title>ChatGPT [Copied]</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="side-top">
        <div class="brand"><img class="brand-mark" src="./icon-192.png" alt="Copied"><span>ChatGPT <small>[Copied]</small></span></div>
        <button class="icon-btn mobile-close" id="closeSidebar" aria-label="Fechar menu">✕</button>
      </div>
      <button class="new-chat" id="newChat"><span>＋</span> Nova conversa</button>
      <div class="history-heading">As tuas conversas</div>
      <nav id="chatList" class="chat-list" aria-label="Histórico de conversas"></nav>
      <div class="sidebar-bottom">
        <div class="profile-dot">C</div>
        <div><strong>ChatGPT [Copied]</strong><small>Versão pessoal</small></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="openSidebar" aria-label="Abrir menu">☰</button>
        <div class="topbar-center">
          <div class="model-label">ChatGPT [Copied]</div>
          <select id="modelSelect" class="model-select" aria-label="Escolher fornecedor e modelo">
            <optgroup label="Groq">
              <option value="groq::openai/gpt-oss-120b">GPT-OSS 120B</option>
              <option value="groq::qwen/qwen3.8-27b">Qwen 3.8 27B</option>
            </optgroup>
            <optgroup label="NVIDIA — Free Endpoint">
              <option value="nvidia::nvidia/nemotron-3.5-bolt-e4b">Nemotron 3.5 Bolt E4B</option>
              <option value="nvidia::nvidia/nemotron-3.5-super-vl-120b-a12b">Nemotron 3.5 Super VL 120B</option>
              <option value="nvidia::z-ai/glm-5.3">GLM-5.3</option>
              <option value="nvidia::z-ai/glm-5.3-flash">GLM-5.3 Flash</option>
            </optgroup>
          </select>
        </div>
        <button class="icon-btn" id="clearChat" title="Limpar conversa" aria-label="Limpar conversa">＋</button>
      </header>

      <section class="conversation" id="conversation">
        <div class="welcome" id="welcome">
          <img class="welcome-logo" src="./icon-512.png" alt="Copied">
          <h1>Em que posso ajudar?</h1>
          <p>Uma versão pessoal, criada por ti.</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="Ajuda-me a aprender JavaScript."><b>⌘</b><span>Aprender programação<small>Explica-me um conceito</small></span></button>
            <button class="suggestion" data-prompt="Dá-me ideias para um projeto HTML original."><b>✧</b><span>Criar um projeto<small>Transforma uma ideia em plano</small></span></button>
            <button class="suggestion" data-prompt="Ajuda-me a organizar as minhas tarefas de hoje."><b>☷</b><span>Organizar ideias<small>Faz um plano simples</small></span></button>
            <button class="suggestion" data-prompt="Explica-me como funciona a inteligência artificial."><b>◎</b><span>Explorar IA<small>Aprender algo novo</small></span></button>
          </div>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>
      </section>

      <footer class="composer-wrap">
        <form class="composer" id="chatForm">
          <textarea id="messageInput" rows="1" maxlength="8000" placeholder="Envia uma mensagem..." aria-label="Mensagem"></textarea>
          <button class="send-btn" id="sendBtn" type="submit" aria-label="Enviar mensagem">↑</button>
        </form>
        <p class="usage" id="usageInfo">Tokens da última resposta: —</p>
        <p class="disclaimer">O ChatGPT [Copied] pode cometer erros. Confirma informações importantes.</p>
      </footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
